<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="面向中小企业与门店的 GEO 服务，连接 AI 搜索诊断、内容优化与媒体发布。">
  <title>GEO 优化 · 看见品牌的 AI 搜索表现</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #172b36; background: #f8faf9; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: inherit; text-underline-offset: 4px; }
    .page { width: min(1080px, calc(100% - 48px)); margin: auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 30px 0; border-bottom: 1px solid #dfe7e3; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 650; }
    .mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: #126347; color: white; font-size: 22px; }
    .domain { color: #576e66; font-size: 14px; }
    .hero { padding: 82px 0 55px; }
    .eyebrow { margin: 0 0 20px; color: #126347; font-size: 14px; font-weight: 600; letter-spacing: .1em; }
    h1 { margin: 0; max-width: 760px; font-size: clamp(34px, 5vw, 56px); line-height: 1.3; letter-spacing: -.04em; font-weight: 650; }
    h1 span { display: block; color: #126347; }
    .intro { max-width: 630px; margin: 24px 0 0; color: #53645d; font-size: 17px; line-height: 1.9; }
    .services { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 0 0 45px; }
    .service { border-top: 2px solid #cadbd3; padding-top: 22px; }
    .number { color: #668376; font-size: 13px; }
    h2 { margin: 16px 0 10px; font-size: 20px; font-weight: 600; }
    .service p { margin: 0; color: #53645d; font-size: 15px; line-height: 1.8; }
    .availability { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px 20px; padding: 22px 26px; border-radius: 12px; background: #eaf1ed; }
    .availability strong { font-size: 15px; color: #25523c; }
    .availability p { margin: 0; font-size: 14px; color: #53645d; line-height: 1.8; }
    footer { margin-top: 52px; padding: 24px 0 30px; border-top: 1px solid #dfe7e3; color: #65716c; font-size: 13px; line-height: 1.9; }
    footer p { margin: 0; }
    @media (max-width: 600px) {
      .page { width: calc(100% - 40px); }
      header { padding: 22px 0; }
      .hero { padding: 50px 0 36px; }
      .intro { font-size: 16px; }
      .services { grid-template-columns: 1fr; gap: 25px; padding-bottom: 32px; }
      .service { padding-top: 16px; }
      h2 { margin-top: 10px; }
      .availability { padding: 20px; gap: 6px; }
      footer { margin-top: 36px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand"><span class="mark" aria-hidden="true">G</span>GEO 优化</div>
      <span class="domain">geohdp.com</span>
    </header>
    <main>
      <section class="hero" aria-labelledby="title">
        <p class="eyebrow">面向中小企业与门店的 GEO 服务</p>
        <h1 id="title">看见品牌的 AI 搜索表现，<span>找到内容优化方向。</span></h1>
        <p class="intro">从 AI 平台的回答中了解品牌表现，结合诊断结果完善品牌内容，衔接媒体发布与交付反馈。</p>
      </section>
      <section class="services" aria-label="服务介绍">
        <article class="service"><span class="number" aria-hidden="true">01</span><h2>AI 搜索诊断</h2><p>观察 AI 平台如何介绍和推荐品牌，让优化有据可依。</p></article>
        <article class="service"><span class="number" aria-hidden="true">02</span><h2>内容优化</h2><p>围绕诊断方向整理品牌内容，形成可确认的优化文章。</p></article>
        <article class="service"><span class="number" aria-hidden="true">03</span><h2>媒体发布</h2><p>连接媒体发布服务，跟进发布进展与交付结果。</p></article>
      </section>
      <aside class="availability" aria-label="开放状态"><strong>平台正在筹备中</strong><p>在线服务与充值暂未开放，敬请期待。</p></aside>
    </main>
    <footer>
      <p>GEO 优化 · geohdp.com</p>
      <p><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">粤ICP备11067188号</a></p>
    </footer>
  </div>
</body>
</html>
