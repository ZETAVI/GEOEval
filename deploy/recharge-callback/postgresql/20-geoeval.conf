# Dedicated GEO PostgreSQL 16/main budget. Apply only while the cluster has no
# non-GEO consumer; these settings require a controlled restart.
max_connections = 30
shared_buffers = 128MB
work_mem = 2MB
maintenance_work_mem = 32MB
effective_cache_size = 512MB
# Prisma PG DateTime transport requires a UTC database session. User-facing and
# payment-channel times are formatted explicitly as Asia/Shanghai (UTC+8).
timezone = 'UTC'
