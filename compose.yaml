name: geoeval-foundation

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: geoeval
      POSTGRES_USER: geoeval
      POSTGRES_PASSWORD: geoeval_local_only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoeval -d geoeval"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - geoeval-postgres:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:8.2.8@sha256:2f7462b9e93e0a7ae2edf3a0a0babc8a4d29f8bfc50849b906b7caaef925edc1
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - geoeval-redis:/data
    restart: unless-stopped

volumes:
  geoeval-postgres:
  geoeval-redis:
