packages:
  - apps/*
  - packages/*

allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true

minimumReleaseAgeExclude:
  - "@nestjs/common@11.2.2"
  - "@nestjs/core@11.2.2"
  - "@nestjs/platform-express@11.2.2"
  - bullmq@6.2.1
