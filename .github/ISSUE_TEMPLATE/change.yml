name: Product or Engineering Change
description: Propose and track a consequential behavior change
title: "[Change]: "
labels:
  - change
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and desired outcome
      description: Describe the problem and observable outcome, not the implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: dropdown
    id: class
    attributes:
      label: Initial change class
      options:
        - Trivial
        - Standard
        - Architectural
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Change record
      description: Link to openspec/changes/<change-id>/ when required.
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance boundaries
    validations:
      required: true

