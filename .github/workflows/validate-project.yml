name: 校验完整项目

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: validate-project-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project:
    name: 完整项目校验
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 配置 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: pnpm
      - name: 安装锁定版本依赖
        run: pnpm install --frozen-lockfile
      - name: 启动测试基础设施
        run: pnpm infra:up
      - name: 生成数据库客户端
        run: pnpm db:generate
      - name: 执行数据库迁移
        run: pnpm db:migrate
      - name: 校验代码格式
        run: pnpm format:check
      - name: 执行类型检查
        run: pnpm typecheck
      - name: 执行后端测试
        run: pnpm --filter @geoeval/backend test
      - name: 执行 Web 测试
        run: pnpm --filter @geoeval/web test
      - name: 构建完整项目
        run: pnpm build
      - name: 检查生成产物漂移
        run: git diff --exit-code
      - name: 回收测试基础设施
        if: always()
        run: pnpm infra:down
