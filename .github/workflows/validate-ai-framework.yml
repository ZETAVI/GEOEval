name: 校验 AI Native 项目框架

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: AI Native 框架校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 校验项目方法论与治理框架
        run: python3 scripts/validate_project_framework.py
